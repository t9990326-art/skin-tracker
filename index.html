<body>
<title>Чистая кожа</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: одна колонка-телефон из «стикеров»: шапка с кольцом → отметки дня → серии → календарь. Единая светлая тема, как у иконки. */
:root{
  --bg:#FFF6E9; --card:#FFFDF8; --ink:#2A1A12; --muted:#6B574A;
  --red:#EF2B28; --green:#3CAA5C; --gold:#F5A93B; --pink:#F37EA8; --milk:#CFE3F7;
  --pink-soft:#FBD9E5; --milk-soft:#E6F0FA; --gold-soft:#FCE4C0; --green-soft:#CBEAD5;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-weight:700;font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;
  -webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}
h1,h2{margin:0;font-weight:900;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:28px;line-height:1.1}
h2{font-size:20px}
.muted{color:var(--muted);font-weight:700}
.st{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink)}
.press{transition:transform .08s,box-shadow .08s}
.press:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.press:disabled{opacity:.35;cursor:default;transform:none}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .emo{font-size:22px;line-height:1}
.gear{width:48px;height:48px;border-radius:24px;background:var(--gold);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;flex:none}
.gear svg{width:22px;height:22px}
.hero{display:flex;align-items:center;gap:16px;padding:16px;margin-top:16px}
.ring{width:92px;height:92px;flex:none;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:3px;border-radius:50%;border:9px solid var(--red)}
.ring b{position:relative;font-size:34px;font-weight:900;font-variant-numeric:tabular-nums}
.hero-txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.hero-txt .big{font-size:20px;font-weight:900}
.hero-txt .small{font-size:13px}
.bar{height:14px;border-radius:99px;border:2.5px solid var(--ink);background:var(--bg);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold);border-right:2.5px solid var(--ink);min-width:10px}
.chip{align-self:flex-start;background:var(--gold);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);border-radius:12px;padding:4px 10px;font-size:14px;font-weight:800}

/* день */
.card{padding:16px;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .t{text-align:center}
.nav .t b{display:block;font-size:20px;font-weight:900}
.nav .t span{font-size:13px}
.arr{width:42px;height:42px;border-radius:12px;background:var(--card);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;flex:none}
.arr svg{width:16px;height:16px}
.habit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.habit+.habit{border-top:2px solid rgba(42,26,18,.12);padding-top:14px}
.tile{width:48px;height:48px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:26px}
.habit .nm{min-width:0}
.habit .nm b{display:block;font-size:17px;font-weight:900}
.habit .nm span{font-size:11px;font-weight:700;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:8px}
.mk{width:100px;height:34px;border-radius:10px;background:var(--bg);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:13px;font-weight:900}
.mk[aria-pressed="true"]{color:#fff;box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.mk.ok[aria-pressed="true"]{background:var(--green)}
.mk.bad[aria-pressed="true"]{background:var(--red)}

/* серии */
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.sk{border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:0}
.sk .e{font-size:24px}
.sk b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.sk span{font-size:12px;color:var(--muted)}

/* календарь */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);margin-right:5px;vertical-align:-2px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 6px}
.wd{font-size:11px;font-weight:900;color:var(--muted);text-align:center}
.cell{min-height:46px;border-radius:10px;background:var(--bg);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.cell.empty{visibility:hidden}
.cell.ok{background:var(--green);color:#fff}
.cell.bad{background:var(--red);color:#fff}
.cell.goal{background:var(--gold)}
.cell.sel{border-width:3.5px;box-shadow:0 3px 0 var(--ink)}
.cell:disabled{opacity:.35;cursor:default}
.cell.goal:disabled{opacity:1}
.dots{display:flex;gap:2px}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(42,26,18,.18)}
.dots i.o{background:var(--green)}.dots i.x{background:var(--red)}
.flag{font-size:9px;line-height:1}

/* оверлеи */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(18px,env(safe-area-inset-left,0px))}
.ov .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.done{background:var(--red);color:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:14px;height:44px;padding:0 18px;font-weight:900;font-size:16px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:15px}
.mode .e{font-size:28px}
.mode[aria-pressed="true"]{background:var(--red);color:#fff;border-width:3.5px;box-shadow:0 2px 0 var(--ink)}
.field{padding:16px;display:flex;flex-direction:column;gap:8px}
.field .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.field b{font-size:17px;font-weight:900}
input[type=date]{font:inherit;font-weight:900;font-size:16px;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:12px;padding:8px 12px;min-height:44px;max-width:100%}

/* поздравление */
.cele{text-align:center;justify-content:center;min-height:100%}
.cele .in{align-items:center;min-height:calc(100dvh - 60px);justify-content:center}
.cup{width:170px;height:170px;border-radius:50%;background:var(--card);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;position:relative;font-size:80px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.cup::before{content:"";position:absolute;inset:5px;border-radius:50%;border:12px solid var(--red)}
.cup span{position:relative}
.cele h1{font-size:38px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stats .sk b{font-size:30px}
.wide{width:100%;height:56px;border-radius:18px;font-weight:900;font-size:17px}
.wide.red{background:var(--red);color:#fff}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:21}
.conf span{position:absolute;top:-60px;font-size:30px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(calc(100dvh + 120px)) rotate(var(--r))}}
@keyframes pop{from{transform:scale(.2) rotate(-40deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.conf{display:none}.cup{animation:none}.press,.mk{transition:none}}
</style>

<main id="app" aria-live="polite"></main>
<div id="layer"></div>

<script>
const H=[
  {k:"sweet",e:"🍩",n:"Сладкое",s:"конфеты, шоколад, газировка",c:"var(--pink)",soft:"var(--pink-soft)"},
  {k:"dairy",e:"🥛",n:"Молочное",s:"молоко, йогурты, сыр, протеин",c:"var(--milk)",soft:"var(--milk-soft)"},
  {k:"flour",e:"🥐",n:"Мучное",s:"хлеб, выпечка, макароны",c:"var(--gold)",soft:"var(--gold-soft)"}
];
const WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WDF=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const ICON_L='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5 5 8l5.5 5.5"/></svg>';
const ICON_R='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 2.5 11 8l-5.5 5.5"/></svg>';
const ICON_GEAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>';

/* даты как "YYYY-MM-DD" */
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return key(d)};
const today=()=>key(new Date());
const diff=(a,b)=>{const[x,y]=[a,b].map(s=>{const[p,q,r]=s.split("-").map(Number);return Date.UTC(p,q-1,r)});return Math.round((y-x)/864e5)};
const nice=s=>{const d=parse(s);return d.getDate()+" "+MON[d.getMonth()]};
function cleanLabel(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"чистый<br>день";if(a>=2&&a<=4&&!(b>=12&&b<=14))return"чистых<br>дня";return"чистых<br>дней"}
function plural(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"день";if(a>=2&&a<=4&&!(b>=12&&b<=14))return"дня";return"дней"}

/* состояние */
let S={days:{},start:"2026-11-02",hasGoal:true,goal:"2026-12-31"};
let sel=today(), month=today().slice(0,7), ui=null; // ui: null | "settings" | "cele"
let docRef=null, saveTimer=null;

function load(){
  try{
    const v=JSON.parse(localStorage.getItem("ck-v2")||"null");
    if(v&&v.days){S={...S,...v};return}
    const old=JSON.parse(localStorage.getItem("ck-days")||"null");
    if(old)S.days=old;
  }catch(e){}
}
function save(){
  try{localStorage.setItem("ck-v2",JSON.stringify(S))}catch(e){}
  if(!docRef)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{docRef.set(JSON.parse(JSON.stringify(S))).catch(()=>{})},500);
}

const mark=(d,k)=>(S.days[d]||{})[k];
function dayState(d){const v=S.days[d]||{};if(Object.values(v).includes("bad"))return"bad";if(H.every(h=>v[h.k]==="ok"))return"ok";return null}
function streak(k){let d=today(),n=0;if(!mark(d,k))d=add(d,-1);while(d>=S.start&&mark(d,k)==="ok"){n++;d=add(d,-1)}return n}
function cleanStreak(){let d=today(),n=0;if(!dayState(d))d=add(d,-1);while(d>=S.start&&dayState(d)==="ok"){n++;d=add(d,-1)}return n}
function best(){let b=0,c=0,d=S.start,t=today();while(d<=t){if(dayState(d)==="ok"){c++;b=Math.max(b,c)}else c=0;d=add(d,1)}return b}
function cleanDays(a,b){let n=0,d=a;while(d<=b){if(dayState(d)==="ok")n++;d=add(d,1)}return n}

/* отрисовка */
function render(){
  const t=today();
  const left=Math.max(0,diff(t,S.goal));
  let heroNum, heroTxt;
  if(S.hasGoal){
    const total=Math.max(1,diff(S.start,S.goal));
    const p=Math.min(1,Math.max(0,(total-left)/total));
    heroNum=left;
    let head,sub;
    if(t>S.goal||dayState(S.goal)==="ok"){head="Цель взята! 💪";sub="Ставь новую дату или переходи в бесконечный режим."}
    else if(left===0){head="Последний день! 💥";sub="Добей его: три «Держусь» вечером, и цель твоя."}
    else{head=plural(left)+" до цели";sub="Держись, бро. Без сладкого, молочки и мучного."}
    heroTxt=`<span class="big">${head}</span><span class="small muted">${sub}</span><div class="bar" aria-hidden="true"><i style="width:${(p*100).toFixed(1)}%"></i></div>`;
  }else{
    const s=cleanStreak(),b=best();
    heroNum=s;
    heroTxt=`<span class="big">${plural(s)} подряд без срывов</span><span class="chip">🏆 Рекорд: ${b} ${plural(b)}</span>`;
  }

  const sd=parse(sel);
  const rel=sel===t?"Сегодня":sel===add(t,-1)?"Вчера":WDF[sd.getDay()];

  const habits=H.map(h=>{const m=mark(sel,h.k);return`
    <div class="habit">
      <div class="tile" style="background:${h.c}" aria-hidden="true">${h.e}</div>
      <div class="nm"><b>${h.n}</b><span>${h.s}</span></div>
      <div class="btns">
        <button class="mk ok press" data-act="mark" data-k="${h.k}" data-v="ok" aria-pressed="${m==="ok"}">Держусь</button>
        <button class="mk bad press" data-act="mark" data-k="${h.k}" data-v="bad" aria-pressed="${m==="bad"}">Сорвался</button>
      </div>
    </div>`}).join("");

  const streaks=H.map(h=>{const n=streak(h.k);return`<div class="sk st" style="background:${h.soft}"><span class="e" aria-hidden="true">${h.e}</span><b>${n}</b><span>${plural(n)}</span></div>`}).join("");

  const minM=S.start.slice(0,7), maxM=(S.hasGoal&&S.goal>t?S.goal:t).slice(0,7);
  if(month<minM)month=minM; if(month>maxM)month=maxM;
  const [yy,mm]=month.split("-").map(Number);
  const first=new Date(yy,mm-1,1), count=new Date(yy,mm,0).getDate(), off=(first.getDay()+6)%7;
  let cells=WD.map(w=>`<div class="wd">${w}</div>`).join("")+"<div class='cell empty'></div>".repeat(off);
  for(let i=1;i<=count;i++){
    const d=yy+"-"+pad(mm)+"-"+pad(i), st=dayState(d), isGoal=S.hasGoal&&d===S.goal;
    const dis=d>t||d<S.start;
    const cls=["cell","press",st||"",(!st&&isGoal)?"goal":"",d===sel?"sel":""].join(" ");
    const inner=st?"":(isGoal?'<span class="flag">🏁</span>':`<span class="dots">${H.map(h=>{const m=mark(d,h.k);return`<i class="${m==="ok"?"o":m==="bad"?"x":""}"></i>`}).join("")}</span>`);
    cells+=`<button class="${cls}" data-act="pick" data-d="${d}" ${dis?"disabled":""} aria-label="${i} ${MON[mm-1]}">${i}${inner}</button>`;
  }

  document.getElementById("app").innerHTML=`
  <section>
    <div class="top">
      <div><div class="emo" aria-hidden="true">🍩🥛🥐</div><h1>${S.hasGoal?"Чистая кожа к "+nice(S.goal):"Чистая кожа"}</h1></div>
      <button class="gear press" data-act="settings" aria-label="Настройки">${ICON_GEAR}</button>
    </div>
    <div class="hero st"><div class="ring"><b>${heroNum}</b></div><div class="hero-txt">${heroTxt}</div></div>
  </section>

  <section class="card st" aria-label="Отметки за день">
    <div class="nav">
      <button class="arr press" data-act="prev" ${sel<=S.start?"disabled":""} aria-label="Предыдущий день">${ICON_L}</button>
      <div class="t"><b>${rel}</b><span class="muted">${nice(sel)}</span></div>
      <button class="arr press" data-act="next" ${sel>=t?"disabled":""} aria-label="Следующий день">${ICON_R}</button>
    </div>
    ${habits}
  </section>

  <section><h2>Серии без срывов</h2><div class="streaks">${streaks}</div></section>

  <section class="card st" aria-label="Календарь">
    <div class="nav">
      <button class="arr press" data-act="mprev" ${month<=minM?"disabled":""} aria-label="Предыдущий месяц">${ICON_L}</button>
      <div class="t"><b style="font-size:18px">${MONN[mm-1]} ${yy}</b></div>
      <button class="arr press" data-act="mnext" ${month>=maxM?"disabled":""} aria-label="Следующий месяц">${ICON_R}</button>
    </div>
    <div class="legend"><span><i style="background:var(--green)"></i>чистый день</span><span><i style="background:var(--red)"></i>срыв</span>${S.hasGoal?'<span><i style="background:var(--gold)"></i>цель</span>':""}</div>
    <div class="grid">${cells}</div>
  </section>`;

  renderLayer();
}

function renderLayer(){
  const L=document.getElementById("layer");
  if(ui==="settings"){
    L.innerHTML=`
    <div class="ov" role="dialog" aria-modal="true" aria-label="Настройки"><div class="in">
      <div class="top"><h1 style="font-size:30px">Настройки</h1><button class="done press" data-act="close">Готово</button></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <h2>Цель</h2>
        <div class="modes">
          <button class="mode st press" data-act="mode" data-v="goal" aria-pressed="${S.hasGoal}"><span class="e">📅</span>До даты</button>
          <button class="mode st press" data-act="mode" data-v="endless" aria-pressed="${!S.hasGoal}"><span class="e">♾️</span>Бесконечно</button>
        </div>
        <span class="muted" style="font-size:13px">${S.hasGoal?"Наверху будет обратный отсчёт до выбранной даты.":"Без конечной даты. Наверху считается, сколько дней подряд ты держишься по всем трём пунктам, и твой рекорд."}</span>
      </div>
      ${S.hasGoal?`<div class="field st"><div class="row"><b>🏁 Держусь до</b><input type="date" id="goal" value="${S.goal}" min="${today()}"></div></div>`:""}
      <div class="field st" style="background:var(--gold-soft)">
        <div class="row"><b>🚀 Начал</b><input type="date" id="start" value="${S.start}" max="${today()}"></div>
        <span class="muted" style="font-size:12px">С этого дня считаются серии и прогресс. Старые отметки никуда не деваются.</span>
      </div>
    </div></div>`;
  }else if(ui==="cele"){
    const em=["🍩","🥛","🥐","🎉","✨","💪","🏆","🍫"];
    let conf="";
    for(let i=0;i<40;i++)conf+=`<span style="left:${(3+Math.random()*94).toFixed(1)}%;animation-duration:${(3+Math.random()*3).toFixed(2)}s;animation-delay:${(Math.random()*3).toFixed(2)}s;--r:${Math.round(Math.random()*720-360)}deg">${em[i%8]}</span>`;
    const cd=cleanDays(S.start,S.goal), tot=diff(S.start,S.goal)+1, b=best();
    L.innerHTML=`
    <div class="ov cele" role="dialog" aria-modal="true" aria-label="Поздравление"><div class="in">
      <div class="cup"><span>🏆</span></div>
      <h1>Ты сделал это!</h1>
      <p class="muted" style="margin:0;font-size:16px">Цель взята. Без сладкого, молочки и мучного, и ты выдержал. Респект, бро!</p>
      <div class="stats">
        <div class="sk st" style="background:var(--green-soft)"><b>${cd}</b><span>${cleanLabel(cd)}</span></div>
        <div class="sk st" style="background:var(--gold-soft)"><b>${tot}</b><span>${plural(tot)}<br>пути</span></div>
        <div class="sk st" style="background:var(--pink-soft)"><b>${b}</b><span>рекорд<br>подряд</span></div>
      </div>
      <button class="wide red st press" data-act="endless">Погнали дальше бесконечно ♾️</button>
      <button class="wide st press" data-act="close">Закрыть</button>
    </div></div>
    <div class="conf" aria-hidden="true">${conf}</div>`;
  }else L.innerHTML="";
  document.body.style.overflow=ui?"hidden":"";
}

/* события */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="mark"){
    const k=b.dataset.k,v=b.dataset.v, day={...(S.days[sel]||{})};
    if(day[k]===v)delete day[k]; else day[k]=v;
    S.days={...S.days,[sel]:day}; save();
    if(v==="ok"&&S.hasGoal&&sel===S.goal&&dayState(sel)==="ok"){ui="cele";try{navigator.vibrate&&navigator.vibrate([30,60,30])}catch(_){}}
    render();
  }
  else if(a==="pick"){sel=b.dataset.d;render();window.scrollTo({top:0,behavior:"smooth"})}
  else if(a==="prev"){sel=add(sel,-1);render()}
  else if(a==="next"){sel=add(sel,1);render()}
  else if(a==="mprev"||a==="mnext"){const[y,m]=month.split("-").map(Number);const d=new Date(y,m-1+(a==="mnext"?1:-1),1);month=d.getFullYear()+"-"+pad(d.getMonth()+1);render()}
  else if(a==="settings"){ui="settings";renderLayer()}
  else if(a==="close"){ui=null;render()}
  else if(a==="mode"){S.hasGoal=b.dataset.v==="goal";save();render()}
  else if(a==="endless"){S.hasGoal=false;ui=null;save();render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="goal"&&e.target.value){S.goal=e.target.value<today()?today():e.target.value;save();render()}
  if(e.target.id==="start"&&e.target.value){S.start=e.target.value>today()?today():e.target.value;if(sel<S.start)sel=S.start;save();render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ui){ui=null;render()}});

load(); render();
setInterval(()=>{if(document.visibilityState==="visible"&&!ui)render()},60000);

/* синхронизация через аккаунт Claude, если страница открыта как артефакт */
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await claude.use("db"), user=await claude.use("user");
    const id=user?await user.id():null;
    if(!db||!id)return;
    docRef=db.doc("data/users/"+id+"/tracker2");
    let first=true;
    docRef.onSnapshot(snap=>{
      if(snap.exists){const r=snap.data();if(r&&r.days){S={...S,...r,days:{...S.days,...r.days}};try{localStorage.setItem("ck-v2",JSON.stringify(S))}catch(_){}if(!ui)render()}}
      else if(first&&Object.keys(S.days).length)save();
      first=false;
    },()=>{});
  }catch(_){}
})();
</script>

</body>
</html>
